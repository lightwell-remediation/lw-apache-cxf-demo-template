server.port=8080
spring.application.name=lw-apache-cxf-sample

cxf.path=/services

# Pre-issued bearer token validated by OAuthRequestFilter. Local sample only.
hello.oauth.access-token=hello-world-token

# CXF logs a stack trace for every rejected bearer token. Keep the HTTP 401, drop the trace.
logging.level.org.apache.cxf.jaxrs.impl.WebApplicationExceptionMapper=ERROR
